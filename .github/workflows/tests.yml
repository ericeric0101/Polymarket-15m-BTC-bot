name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # monitoring/journal_retention.py calls macOS's /usr/sbin/lsof and fails closed
      # ("journal busy") when it is missing. Provide that path on the Ubuntu runner;
      # the production code is unchanged.
      - run: |
          command -v lsof >/dev/null || (sudo apt-get update && sudo apt-get install -y lsof)
          [ -x /usr/sbin/lsof ] || sudo ln -s "$(command -v lsof)" /usr/sbin/lsof
      - run: python -m pytest -q
